[workspace]
members = ["tunesmith-core", "tunesmith-app", "tunesmith-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TuneSmith Team"]
license = "MIT"

[workspace.dependencies]
# Core audio and MIDI
cpal = "0.15"
midly = "0.5"
dasp = { version = "0.11", features = ["all"] }
fundsp = "0.18"
rubato = "0.15"

# Synthesis
rustysynth = "1.3"

# Effects and DSP
# We'll use fundsp + dasp for basic effects

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Threading and concurrency
crossbeam = "0.8"
ringbuf = "0.3"

# Plist for GarageBand export
plist = "1.6"

# Random
rand = "0.8"

# Testing
proptest = "1.4"

# Schema generation
schemars = { version = "0.8", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# ONNX Runtime
ort = "2.0"

# Tauri
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-build = "2.0"

# System info
sysinfo = "0.30"

# Hound for WAV I/O
hound = "3.5"
